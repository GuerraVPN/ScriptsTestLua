<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020817">
<title>Orbis Vault Admin</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#020817;color:#f4f8ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
:root{--bg:#020817;--panel:#07162a;--panel2:#0a2441;--line:#153656;--blue:#168cff;--cyan:#35c8ff;--muted:#9fb5cd;--green:#1fd38a;--red:#ff5263;--amber:#ffbd4a}
button,input,textarea,select{font:inherit}.hidden{display:none!important}.screen{min-height:100%;background:radial-gradient(circle at 75% -5%,#0b3f7a 0,#041327 28%,#020817 62%)}
#splash{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px}.vaultlogo{width:112px;height:112px;border-radius:50%;background:#07162a;border:5px solid #168cff;box-shadow:0 0 42px #168cff70,inset 0 0 28px #168cff40;position:relative}.vaultlogo:before,.vaultlogo:after{content:"";position:absolute;background:#35c8ff;border-radius:4px}.vaultlogo:before{width:58px;height:6px;left:22px;top:48px}.vaultlogo:after{height:58px;width:6px;left:48px;top:22px}.vaultlogo i{position:absolute;width:42px;height:42px;left:30px;top:30px;border:5px solid #f4f8ff;border-radius:50%;z-index:2}.logo{font-size:31px;letter-spacing:4px;font-weight:900}.logo b{color:var(--cyan)}.tag{color:var(--muted);font-size:12px;letter-spacing:2px;text-transform:uppercase;text-align:center}.loader{width:185px;height:6px;background:#0a2441;border-radius:10px;overflow:hidden}.loader i{display:block;width:70%;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));animation:load 1.1s ease-in-out infinite}@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(150%)}}
#login{display:flex;align-items:center;justify-content:center;padding:26px}.loginbox{width:100%;max-width:440px}.mini{margin:0 auto 18px;width:78px;height:78px}.mini i{width:28px;height:28px;left:20px;top:20px}.loginbox h1{text-align:center;margin:10px 0 4px}.loginbox p{text-align:center;color:var(--muted);margin-top:0}
.field{width:100%;margin:9px 0;padding:14px 15px;border-radius:12px;border:1px solid var(--line);background:#08182b;color:white;outline:none}.field:focus{border-color:var(--blue);box-shadow:0 0 0 2px #168cff22}.primary,.secondary,.dangerBtn{width:100%;border-radius:12px;padding:14px;font-weight:800}.primary{border:0;background:linear-gradient(90deg,#087cff,#22a8ff);color:white}.secondary{border:1px solid var(--line);background:#091a2e;color:#d8e8f9}.dangerBtn{border:1px solid #7d2330;background:#32101a;color:#ff9aa5}.note{padding:12px;border-radius:12px;background:#0b223b;border:1px solid #17416a;color:#b9d4ed;font-size:12px;margin:14px 0}.error{background:#32101a;border-color:#6a1f2b;color:#ffb2ba}.success{background:#083927;border-color:#15603f;color:#74efb7}
#app{padding-bottom:76px}.top{position:sticky;top:0;z-index:5;padding:17px 18px 10px;background:linear-gradient(#020817 75%,transparent)}.topline{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:1px}.brand b{color:var(--cyan)}.avatar{width:38px;height:38px;border-radius:50%;background:#0d3157;display:grid;place-items:center;border:1px solid #1a4f7d}.content{padding:0 16px 20px}.content h2{margin:10px 0 2px}.sub{color:var(--muted);font-size:13px;margin:0 0 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:linear-gradient(145deg,#0a2441,#07162a);border:1px solid var(--line);border-radius:16px;padding:15px}.stat strong{display:block;font-size:26px;margin-top:6px}.stat small{color:var(--muted)}.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}.link,.blue{color:var(--cyan)}.green{color:var(--green)}.muted{color:var(--muted)}
.game{display:flex;gap:12px;align-items:center;padding:12px;margin:8px 0;background:#07162a;border:1px solid var(--line);border-radius:14px}.cover{width:54px;height:68px;border-radius:9px;background:linear-gradient(145deg,#0a5ca9,#071426);display:grid;place-items:center;font-size:25px;overflow:hidden;flex:0 0 auto}.cover img{width:100%;height:100%;object-fit:cover}.game-info{flex:1;min-width:0}.game-info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.game-info small{display:block;color:var(--muted);margin-top:3px}.dot{width:9px;height:9px;border-radius:50%;background:var(--green)}
.search{position:relative}.chips,.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:6px}.chip,.tab{white-space:nowrap;border:1px solid var(--line);background:#07162a;color:#bdd1e5;border-radius:999px;padding:8px 12px}.chip.active,.tab.active{background:#0d63b9;border-color:#168cff;color:#fff}.form-card{background:#07162a;border:1px solid var(--line);border-radius:16px;padding:14px}.label{display:block;color:#b6cae0;font-size:12px;margin:12px 2px 4px}.area{min-height:95px;resize:vertical}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.package{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:#081a2e}.package .meta{flex:1;min-width:0}.package .meta b,.package .meta small{display:block;overflow:hidden;text-overflow:ellipsis}.package .meta small{color:var(--muted)}.iconbtn{border:0;background:#0e2948;color:#9edaff;border-radius:9px;padding:8px 10px}.trash{color:#ff8190;background:#38131d}.status{padding:14px;border-radius:14px;background:#07162a;border:1px solid var(--line);margin:10px 0}.statusline{display:flex;align-items:center;gap:12px}.pill{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px}.ok{background:#083927;color:#55e6a9}.off{background:#351019;color:#ff7d8b}
.menuitem{display:flex;align-items:center;gap:13px;padding:15px;margin:7px 0;border:1px solid var(--line);border-radius:14px;background:#07162a}.menuitem .mi{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#0d3157}.menuitem .mt{flex:1}.menuitem small{color:var(--muted);display:block;margin-top:2px}.bottom{position:fixed;left:0;right:0;bottom:0;height:70px;display:grid;grid-template-columns:repeat(5,1fr);background:#061223ee;border-top:1px solid #143557;z-index:20}.nav{border:0;background:transparent;color:#8da8c4;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.nav span{font-size:21px}.nav.active{color:#44b9ff}.nav.add span{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:var(--blue);color:white;font-size:28px;margin-top:-18px}
.toast{position:fixed;left:18px;right:18px;bottom:84px;background:#0b2b48;border:1px solid #1c5d93;color:#e6f5ff;padding:13px 15px;border-radius:13px;z-index:60;transform:translateY(180px);transition:.25s}.toast.show{transform:translateY(0)}.modal{position:fixed;inset:0;background:#000b;z-index:50;display:flex;align-items:flex-end}.sheet{width:100%;max-height:88%;overflow:auto;background:#061426;border-radius:24px 24px 0 0;border-top:1px solid #1b4a74;padding:18px}.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #12304d}
@media(min-width:700px){.content,.top{max-width:720px;margin:auto}.bottom{left:50%;transform:translateX(-50%);max-width:720px}}
</style>
</head>
<body>
<div id="splash" class="screen"><div class="vaultlogo"><i></i></div><div class="logo">ORBIS <b>VAULT</b></div><div class="tag">Gerencie seu catálogo PS4</div><div class="loader"><i></i></div><small class="muted">v0.4.0</small></div>
<div id="login" class="screen hidden"><div class="loginbox"><div class="vaultlogo mini"><i></i></div><div class="logo" style="text-align:center;font-size:25px">ORBIS <b>VAULT</b></div><h1>Entre na sua conta</h1><p>Admin conectado ao Cloudflare.</p><input id="loginEmail" class="field" type="email" placeholder="E-mail"><input id="loginPass" class="field" type="password" placeholder="Senha"><button id="loginBtn" class="primary" onclick="login()">Entrar</button><div id="loginMsg"></div><div class="note">A senha não fica salva no aplicativo. O token de sessão é temporário.</div></div></div>
<div id="app" class="screen hidden"><header class="top"><div class="topline"><div class="brand">ORBIS <b>VAULT</b> <small class="muted">ADMIN</small></div><div class="avatar" onclick="logout()">👤</div></div></header><main id="view" class="content"></main><nav class="bottom"><button class="nav active" data-view="home" onclick="go('home')"><span>⌂</span>Início</button><button class="nav" data-view="games" onclick="go('games')"><span>🎮</span>Jogos</button><button class="nav add" data-view="add" onclick="go('add')"><span>＋</span>Adicionar</button><button class="nav" data-view="sync" onclick="go('sync')"><span>⇅</span>Sincronizar</button><button class="nav" data-view="more" onclick="go('more')"><span>•••</span>Mais</button></nav></div>
<div id="toast" class="toast"></div><div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div id="sheet" class="sheet"></div></div>
<script src="core-v03.js"></script>
<script src="views-v03.js"></script>
<script src="create-v03.js"></script>
<script src="edit-v03.js"></script>
<script src="delete-v03.js"></script>
<script src="cover-v03.js"></script>
<script src="remote-v04.js"></script>
</body>
</html>
