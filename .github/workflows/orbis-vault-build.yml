name: Orbis Vault Build

on:
  push:
    branches:
      - orbis-vault-build-020
    paths:
      - 'orbisvault/**'
      - '.github/workflows/orbis-vault-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: orbisvault
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p artifact/sign-tools/lib
          cp orbisvault/app/build/outputs/apk/release/app-release-unsigned.apk artifact/OrbisVaultAdmin-v0.2.0-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" artifact/sign-tools/lib/apksigner.jar
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" artifact/sign-tools/zipalign
          chmod +x artifact/sign-tools/zipalign
          sha256sum artifact/OrbisVaultAdmin-v0.2.0-unsigned.apk > artifact/SHA256-unsigned.txt

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: OrbisVaultAdmin-v0.2.0-build
          path: artifact/
          retention-days: 1
