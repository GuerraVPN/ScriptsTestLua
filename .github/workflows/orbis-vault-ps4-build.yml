name: Orbis Vault PS4 Build

concurrency:
  group: orbis-vault-ps4-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - orbis-vault-ps4-010
    paths:
      - 'orbisvault-ps4/**'
      - '.github/workflows/orbis-vault-ps4-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check integrated Worker syntax
        shell: bash
        run: |
          cp orbisvault-ps4/backend/orbis-vault-worker-v04.js /tmp/orbis-vault-worker-v04.mjs
          node --check /tmp/orbis-vault-worker-v04.mjs

      - name: Install host LLVM tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          command -v clang
          command -v clang++
          command -v ld.lld

      - name: Install OpenOrbis v0.5.4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openorbis"
          curl -fL --retry 3             "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz"             -o "$RUNNER_TEMP/openorbis.tar.gz"
          tar -xzf "$RUNNER_TEMP/openorbis.tar.gz" -C "$RUNNER_TEMP/openorbis"
          PKG_TOOL="$(find "$RUNNER_TEMP/openorbis" -type f -path '*/bin/linux/PkgTool.Core' -print -quit)"
          if [ -z "$PKG_TOOL" ]; then
            echo "PkgTool.Core not found"
            exit 1
          fi
          SDK_ROOT="${PKG_TOOL%/bin/linux/PkgTool.Core}"
          chmod +x "$SDK_ROOT"/bin/linux/* || true
          echo "OO_PS4_TOOLCHAIN=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "OpenOrbis root: $SDK_ROOT"
          ls -la "$SDK_ROOT/bin/linux" | head -80

      - name: Build eboot and GP4
        shell: bash
        run: |
          set -euo pipefail
          cd orbisvault-ps4
          make clean
          make pkg.gp4

      - name: Build PKG with compatible PkgTool runtime
        shell: bash
        run: |
          set -euo pipefail
          docker pull openorbisofficial/toolchain:latest
          docker run --rm --user 0             -w /workspace/orbisvault-ps4             -v "$GITHUB_WORKSPACE:/workspace"             openorbisofficial/toolchain:latest             bash -lc "/lib/OpenOrbisSDK/bin/linux/PkgTool.Core pkg_build pkg.gp4 ."

      - name: Collect artifact
        shell: bash
        run: |
          mkdir -p artifact
          cp orbisvault-ps4/*.pkg artifact/
          cp orbisvault-ps4/eboot.bin artifact/
          cp orbisvault-ps4/sce_sys/param.sfo artifact/
          cp orbisvault-ps4/backend/orbis-vault-worker-v04.js artifact/
          cp orbisvault-ps4/backend/remote_schema.sql artifact/
          cp orbisvault-ps4/docs/REMOTE_WORKER_INTEGRATION.md artifact/
          find artifact -maxdepth 1 -type f -print

      - name: SHA256
        shell: bash
        run: |
          cd artifact
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: OrbisVault-PS4-v0.1
          path: artifact/
          if-no-files-found: error
          retention-days: 7
